actor:
  model:
    model_type: recap_value_model
    precision: bf16
    is_lora: false
    siglip_path: /root/rlinf_recap/checkpoints/siglip2-so400m-patch14-224
    gemma3_path: /root/rlinf_recap/checkpoints/gemma-3-270m
    tokenizer_path: /root/rlinf_recap/checkpoints/gemma-3-270m
    critic_expert_variant: gemma_1m
    num_bins: 201
    v_min: -1.0
    v_max: 0.0
    value_dropout: 0.0
    action_dim: 7
    action_horizon: 10
    max_token_len: 200
    action_expert_variant: gemma_300m
    freeze_vision_encoder: false
    train_expert_only: false
    forward_mode: vla
    max_language_len: 50
    stop_gradient_to_vlm: false
    freeze_vlm: false
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 128
  seed: 0
  optim:
    lr: 5.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: constant
    lr_warmup_steps: 500
    total_training_steps: 8000
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0,3
  tracer:
    enable: false
runner:
  task_type: sft
  logger:
    log_path: /root/rlinf_recap/RLinf/logs/value_sft/recap_value_model_sft-20260920-08:51:26
    project_name: rlinf
    experiment_name: value_sft
    logger_backends:
    - tensorboard
  max_epochs: 30000
  max_steps: -1
  val_check_interval: 500
  save_interval: 3000
  per_worker_log: false
  per_worker_log_path: null
data:
  tag: fail300
  train_data_paths:
  - dataset_path: /root/rlinf_recap/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_sft
    type: sft
    weight: 1.0
    robot_type: libero
    model_type: pi05
  - dataset_path: /root/rlinf_recap/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_train
    type: rollout
    weight: 1.0
    robot_type: libero
    model_type: pi05
  eval_data_paths:
  - dataset_path: /root/rlinf_recap/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_eval
    max_samples: 10000
    robot_type: libero
    model_type: pi05
  train_num_workers: 0
  eval_num_workers: 0
  prefetch_factor: 2
  persistent_workers: false
  pin_memory: false
  include_state: true
  gamma: 1.0
  action_horizon: 10
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 7
  robot_type: libero
  model_type: pi05
  balance_weights: true
  seed: 42
algorithm:
  adv_type: gae
reward:
  use_reward_model: false
critic:
  use_critic_model: false
