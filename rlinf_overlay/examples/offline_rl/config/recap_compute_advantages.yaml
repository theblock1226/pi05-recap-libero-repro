# Usage:
#   bash examples/offline_rl/advantage_labeling/recap/process/run_compute_advantages.sh recap_compute_advantages
#   bash examples/offline_rl/advantage_labeling/recap/process/run_compute_advantages.sh recap_compute_advantages --nproc 4 \
#       advantage.value_checkpoint=/path/to/checkpoint

defaults:
  - model/recap_value_model@advantage.model

advantage:
  value_checkpoint: /root/rlinf_recap/RLinf/logs/value_sft/recap_value_model_sft-20260921-10:01:14/value_sft/checkpoints/global_step_3000
  # Inference batch; 1024 OOMs on 48GB with video decode — keep modest.
  batch_size: 64
  flush_interval: 256
  num_dataloader_workers_per_gpu: 4
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  tag: "fail300_N10_ckpt3000_q30"
  returns_tag: "fail300"

  model:
    critic_expert_variant: "gemma_1m"
    tokenizer_path: /root/rlinf_recap/checkpoints/gemma-3-270m
    siglip_path: /root/rlinf_recap/checkpoints/siglip2-so400m-patch14-224
    gemma3_path: /root/rlinf_recap/checkpoints/gemma-3-270m

data:
  # openpi variant the value model was trained with ("pi0" / "pi05"). Must
  # match recap_value_model_sft.yaml's data.model_type — it selects the input
  # transforms and quantile normalization used to score frames.
  model_type: "pi05"

  train_data_paths:
    - dataset_path: "/root/rlinf_recap/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_sft"
      robot_type: "libero"
      type: "sft"
      weight: 1.0
    - dataset_path: "/root/rlinf_recap/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_train"
      robot_type: "libero"
      type: "rollout"
      weight: 1.0

  advantage_lookahead_step: 10
  gamma: 1.0

distributed:
  enabled: true
  backend: "nccl"
  timeout: 3600

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
  job:
    chdir: false
