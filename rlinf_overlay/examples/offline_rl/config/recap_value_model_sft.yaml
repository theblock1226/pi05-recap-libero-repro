# Usage: bash examples/offline_rl/advantage_labeling/recap/run_value_sft.sh recap_value_model_sft

defaults:
  - model/recap_value_model@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  # Single GPU to avoid repeated NCCL timeouts seen with 0,3.
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "value_sft"
    logger_backends: ["tensorboard"]

  max_epochs: 30000
  # Stop at a usable checkpoint for Step 3.
  max_steps: 3000
  # Disabled: full eval on this dataset stalled NCCL for 3h and killed the run.
  val_check_interval: -1
  # ~45-60s/step; 120 steps is about 1.5-2h, safely under 3h.
  save_interval: 120
  resume_dir: /root/rlinf_recap/RLinf/logs/value_sft/recap_value_model_sft-20260921-10:01:14/value_sft/checkpoints/global_step_2520

data:
  # Must match Step 1's data.tag; loads meta/returns_{tag}.parquet (null = legacy meta/returns.parquet)
  tag: "fail300"

  train_data_paths:
    - dataset_path: "/root/rlinf_recap/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_sft"
      type: "sft"
      weight: 1.0
      robot_type: "libero"
      model_type: "pi05"
    - dataset_path: "/root/rlinf_recap/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_train"
      type: "rollout"
      weight: 1.0
      robot_type: "libero"
      model_type: "pi05"

  eval_data_paths:
    - dataset_path: "/root/rlinf_recap/datasets/RECAP-Libero10-Task0-48succ-Data/libero10_task0_eval"
      max_samples: 10000
      robot_type: "libero"
      model_type: "pi05"

  train_num_workers: 0
  eval_num_workers: 0
  prefetch_factor: 2
  persistent_workers: false
  pin_memory: false
  include_state: true
  gamma: 1.0
  action_horizon: 10
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 7
  robot_type: "libero"
  model_type: "pi05"
  balance_weights: true
  seed: 42

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 128
  seed: 0

  model:
    precision: bf16
    siglip_path: "/root/rlinf_recap/checkpoints/siglip2-so400m-patch14-224"
    gemma3_path: "/root/rlinf_recap/checkpoints/gemma-3-270m"
    tokenizer_path: "/root/rlinf_recap/checkpoints/gemma-3-270m"
    freeze_vlm: false
    action_dim: 7
    action_horizon: 10

  optim:
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    lr_scheduler: "constant"
    lr_warmup_steps: 500
    total_training_steps: 8000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
